name: e2e-domain
runtime: yaml
description: E2E test for Domain resource
config:
  projectName:
    type: string
  domainSuffix:
    type: string
    default: e2e
resources:
  testProject:
    type: quant:index:Project
    properties:
      name: ${projectName}
      region: au-govt
  testDomain:
    type: quant:index:Domain
    properties:
      domain: ${domainSuffix}.pulumi-e2e.example.com
      project: ${testProject.machineName}
outputs:
  domainId: ${testDomain.id}
  domain: ${testDomain.domain}
