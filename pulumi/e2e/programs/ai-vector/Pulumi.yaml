name: e2e-ai-vector
runtime: yaml
description: E2E test for AI vector DB resources (AiVectorCollection, AiVectorDocument)
config:
  testSuffix:
    type: string
    default: e2e-test
  docContent:
    type: string
    default: This is a test document for E2E testing of the Pulumi provider.
resources:
  testCollection:
    type: quant:index:AiVectorCollection
    properties:
      name: e2e-collection-${testSuffix}
      embeddingModel: amazon.titan-embed-text-v2:0
  testDocument:
    type: quant:index:AiVectorDocument
    properties:
      collectionId: ${testCollection.id}
      documents:
        - content: ${docContent}
          key: e2e-doc-${testSuffix}
    options:
      dependsOn:
        - ${testCollection}
outputs:
  collectionId: ${testCollection.id}
  collectionName: ${testCollection.name}
  chunksCreated: ${testDocument.chunksCreated}
