name: e2e-crawler
runtime: yaml
description: E2E test for Crawler and CrawlerSchedule resources
config:
  projectName:
    type: string
    default: pulumi-e2e-crawler-test
  region:
    type: string
    default: au
  crawlerDomain:
    type: string
    default: "https://example.com"
  scheduleCron:
    type: string
    default: "0 0 * * 0"
resources:
  testProject:
    type: quant:index:Project
    properties:
      name: ${projectName}
      region: ${region}
  testCrawler:
    type: quant:index:Crawler
    properties:
      project: ${testProject.machineName}
      domain: ${crawlerDomain}
  testSchedule:
    type: quant:index:CrawlerSchedule
    properties:
      project: ${testProject.machineName}
      crawler: ${testCrawler.uuid}
      name: e2e-test-schedule
      scheduleCronString: ${scheduleCron}
outputs:
  crawlerId: ${testCrawler.id}
  crawlerUuid: ${testCrawler.uuid}
  scheduleId: ${testSchedule.id}
