name: e2e-slack-bot
runtime: yaml
description: E2E test for Slack Bot resource (creates an agent + bot)
config:
  testSuffix:
    type: string
    default: e2e-test
  sessionTtl:
    type: integer
    default: 7
resources:
  testAgent:
    type: quant:index:AiAgent
    properties:
      name: e2e-bot-agent-${testSuffix}
      description: Agent for E2E Slack bot test
      systemPrompt: You are a helpful Slack assistant for E2E testing.
      modelId: anthropic.claude-3-5-sonnet-20241022-v2:0
      temperature: 0.5
  testBot:
    type: quant:index:SlackBot
    properties:
      agentId: ${testAgent.agentId}
      setupType: quant
      sessionTtlDays: ${sessionTtl}
      keywordsEnabled: false
outputs:
  agentId: ${testAgent.agentId}
  botId: ${testBot.botId}
  botStatus: ${testBot.bot.status}
