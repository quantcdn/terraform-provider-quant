name: e2e-slack-bot
runtime: yaml
description: E2E test for Slack Bot resource with inline agent config
config:
  testSuffix:
    type: string
    default: e2e-test
  sessionTtl:
    type: integer
    default: 7
  systemPrompt:
    type: string
    default: You are a helpful Slack assistant for E2E testing.
resources:
  testBot:
    type: quant:index:SlackBot
    properties:
      name: e2e-bot-${testSuffix}
      setupType: quant
      systemPrompt: ${systemPrompt}
      modelId: anthropic.claude-3-5-sonnet-20241022-v2:0
      temperature: 0.5
      maxTokens: 4096
      sessionTtlDays: ${sessionTtl}
      keywordsEnabled: false
outputs:
  botId: ${testBot.botId}
