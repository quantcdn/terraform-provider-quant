name: e2e-ai-custom-tool
runtime: yaml
description: E2E test for AI Custom Tool resource with inline edge function
config:
  testSuffix:
    type: string
    default: e2e-test
  toolDescription:
    type: string
    default: A test tool for E2E testing
resources:
  testTool:
    type: quant:index:AiCustomTool
    properties:
      name: e2e_tool_${testSuffix}
      toolName: e2e_tool_${testSuffix}
      description: ${toolDescription}
      edgeFunctionCode: |
        export default async function handler(request) {
          const body = await request.json();
          return new Response(JSON.stringify({
            success: true,
            result: { message: "E2E test response", input: body.input }
          }), { headers: { "Content-Type": "application/json" } });
        }
      inputSchema: {}
      responseMode: llm
      timeoutSeconds: 30
outputs:
  toolName: ${testTool.toolName}
