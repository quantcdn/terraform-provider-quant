# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  version:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # Gate the release on E2E against staging. Every build and publish job below
  # needs this, so a broken provider cannot reach the Terraform Registry or npm.
  # v5.11.0 shipped a 422 on every AiCustomTool write because E2E did not run.
  e2e:
    name: E2E (staging)
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  goreleaser:
    needs: [version, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@286f3b13b1b49da4ac219696163fb8c1c93e1200 # v6.0.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  # NOTE: the jobs below build the pulumi/ module, so they must take their Go
  # version from pulumi/go.mod, not the root one. The two diverged (root
  # 1.25.8, pulumi 1.25.11) and setup-go pins GOTOOLCHAIN=local, so a root-
  # pinned toolchain cannot build pulumi/ and cannot download a newer one:
  #   go: go.mod requires go >= 1.25.11 (running go 1.25.8; GOTOOLCHAIN=local)
  # That failed the v5.12.1 release after E2E and goreleaser had both passed.
  build-provider:
    name: Build Pulumi provider (${{ matrix.os }}-${{ matrix.arch }})
    needs: [version, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: linux
            arch: amd64
          - goos: linux
            goarch: arm64
            os: linux
            arch: arm64
          - goos: darwin
            goarch: amd64
            os: darwin
            arch: amd64
          - goos: darwin
            goarch: arm64
            os: darwin
            arch: arm64
          - goos: windows
            goarch: amd64
            os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'pulumi/go.mod'
          cache: true

      - name: Build Pulumi provider binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/pulumi
          cd pulumi
          BINARY_NAME="pulumi-resource-quant"
          if [ "$GOOS" = "windows" ]; then BINARY_NAME="${BINARY_NAME}.exe"; fi
          go build -ldflags "-s -w -X github.com/quantcdn/terraform-provider-quant/v5/pulumi/provider/pkg/version.Version=${VERSION}" \
            -o "../dist/pulumi/${BINARY_NAME}" ./provider/cmd/pulumi-resource-quant

      - name: Package Pulumi tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TARBALL="pulumi-resource-quant-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "${TARBALL}" -C dist/pulumi .
          echo "PULUMI_TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pulumi-provider-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.PULUMI_TARBALL }}

  publish-github-release:
    name: Publish Pulumi binaries to GitHub Release
    needs: [version, goreleaser, build-provider]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pulumi-provider-*
          merge-multiple: true

      - name: Upload Pulumi provider binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/*.tar.gz \
            --repo "${{ github.repository }}"

  publish-npm:
    name: Publish Pulumi SDK to npm
    needs: [version, goreleaser]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'pulumi/go.mod'
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (ensures OIDC support)
        run: npm install -g npm@latest

      - name: Build tfgen
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd pulumi
          go build -ldflags "-X github.com/quantcdn/terraform-provider-quant/v5/pulumi/provider/pkg/version.Version=${VERSION}" \
            -o ../bin/pulumi-tfgen-quant ./provider/cmd/pulumi-tfgen-quant

      - name: Generate Node.js SDK
        run: cd pulumi && ../bin/pulumi-tfgen-quant nodejs --out sdk/nodejs

      - name: Set SDK version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd pulumi/sdk/nodejs
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Build SDK
        run: |
          cd pulumi/sdk/nodejs
          yarn install --no-lockfile
          yarn run build

      - name: Prepare publishable package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd pulumi/sdk/nodejs
          # tsc outputs to bin/ — copy package metadata into bin/ so we
          # publish compiled .js + .d.ts (not raw .ts which Node 24 rejects).
          cp package.json bin/
          cp README.md bin/ 2>/dev/null || true
          cp Pulumi.yaml bin/ 2>/dev/null || true
          cd bin
          # Set main/types to point at compiled output
          node -e "
            const pkg = require('./package.json');
            pkg.main = 'index.js';
            pkg.types = 'index.d.ts';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to npm
        # Do NOT set NODE_AUTH_TOKEN — OIDC trusted publishing requires it absent
        run: cd pulumi/sdk/nodejs/bin && npm publish --access public
